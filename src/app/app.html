<a hviSkipLink href="#hovedinnhold">Hopp til hovedinnhold</a>

<header class="border-b border-gray-200 bg-white">
  <div
    class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-x-6 gap-y-3 px-4 py-4"
  >
    <a routerLink="/" class="text-xl font-bold text-gray-900 no-underline">
      <span aria-hidden="true">⚽</span> VM-tipping 2026
    </a>
    <nav aria-label="Hovednavigasjon">
      <ul class="flex flex-wrap gap-1">
        <li>
          <a
            routerLink="/"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="bg-blue-100 text-blue-950 font-semibold"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-gray-700 no-underline hover:bg-gray-100"
          >
            Leaderboard
          </a>
        </li>
        <li>
          <a
            routerLink="/sporsmal"
            routerLinkActive="bg-blue-100 text-blue-950 font-semibold"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-gray-700 no-underline hover:bg-gray-100"
          >
            Spørsmål
          </a>
        </li>
        <li>
          <a
            routerLink="/statistikk"
            routerLinkActive="bg-blue-100 text-blue-950 font-semibold"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-gray-700 no-underline hover:bg-gray-100"
          >
            Statistikk
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main id="hovedinnhold" tabindex="-1" class="mx-auto max-w-5xl px-4 py-8">
  <router-outlet />
</main>

<footer class="mx-auto max-w-5xl px-4 pb-8 pt-4 text-sm text-gray-600">
  <p>
    Tippekonkurranse for VM i fotball 2026 · Oppdateres når nye resultater er klare · Vinneren får
    {{ premiepott }} kr
  </p>
</footer>
